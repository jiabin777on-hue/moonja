name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon check --target js --deny-warn
      - run: moon fmt --check
      - run: moon test --target js
      - run: moon test --target wasm-gc
      - run: moon test --target native

  # Runs every case in tests/diff with ninja 1.13.2 and with moonja, and
  # requires identical output, exit codes, files and build log entries.
  difftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ninja 1.13.2 (the reference)
        run: python -m pip install ninja==1.13.2
      - name: Install MoonBit (Linux)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: moon build --target js
      - name: Differential tests against ninja
        shell: bash
        run: node scripts/difftest.mjs --ninja "$(python -c 'import ninja, os; print(os.path.join(ninja.BIN_DIR, "ninja"))')"

  # ninja's own integration tests (misc/output_test.py and
  # misc/jobserver_test.py), run against moonja.
  # They drive the build tool through a pseudo-terminal, which covers the
  # smart-terminal status line the differential tests cannot see.
  ninja-output-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon build --target js --release
      - name: Fetch ninja 1.13.2
        run: git clone --depth 1 --branch v1.13.2 https://github.com/ninja-build/ninja "$RUNNER_TEMP/ninja-src"
      - name: Run misc/output_test.py with moonja as ./ninja
        run: |
          dir="$RUNNER_TEMP/output-test"
          mkdir -p "$dir"
          cp "$RUNNER_TEMP/ninja-src/misc/output_test.py" "$dir/"
          # Absolute paths: some tests run ninja with an empty environment.
          printf '#!/bin/sh\nexec %s %s "$@"\n' "$(command -v node)" "$GITHUB_WORKSPACE/_build/js/release/build/cmd/cmd.js" > "$dir/ninja"
          chmod +x "$dir/ninja"
          cd "$dir" && python3 output_test.py -v
      # misc/jobserver_test.py: real FIFO pools from misc/jobserver_pool.py
      # with 4, 2 and 1 tokens, -j overriding them, a pipe pool's warning,
      # and MAKEFLAGS reaching the commands.
      - name: Run misc/jobserver_test.py with moonja as ./ninja
        run: |
          dir="$RUNNER_TEMP/jobserver-test"
          mkdir -p "$dir"
          cp "$RUNNER_TEMP"/ninja-src/misc/jobserver_*.py "$dir/"
          cp "$RUNNER_TEMP/output-test/ninja" "$dir/ninja"
          cd "$dir" && python3 jobserver_test.py -v

  # A real build: ninja's own sources, configured by CMake's Ninja generator
  # and built by moonja (gcc deps, restat, CMake re-running itself). The
  # ninja it builds must then pass its own unit tests.
  build-ninja-with-moonja:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon build --target js --release
      - name: Install moonja as `moonja`
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec %s %s "$@"\n' "$(command -v node)" "$GITHUB_WORKSPACE/_build/js/release/build/cmd/cmd.js" > "$RUNNER_TEMP/bin/moonja"
          chmod +x "$RUNNER_TEMP/bin/moonja"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Fetch ninja 1.13.2
        run: git clone --depth 1 --branch v1.13.2 https://github.com/ninja-build/ninja "$RUNNER_TEMP/ninja-src"
      - name: Configure with CMake, building with moonja
        run: cmake -S "$RUNNER_TEMP/ninja-src" -B "$RUNNER_TEMP/build" -G Ninja -DCMAKE_MAKE_PROGRAM="$RUNNER_TEMP/bin/moonja" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: time moonja -C "$RUNNER_TEMP/build"
      - name: The built ninja passes its unit tests
        run: |
          "$RUNNER_TEMP/build/ninja_test"
          "$RUNNER_TEMP/build/ninja" --version
      - name: A second build does nothing
        run: moonja -C "$RUNNER_TEMP/build" | tee out.txt && grep -q "no work to do" out.txt
      - name: Touching a header rebuilds its users only
        run: |
          touch "$RUNNER_TEMP/ninja-src/src/eval_env.h"
          moonja -C "$RUNNER_TEMP/build" -d explain | tee out.txt
          ! grep -q "no work to do" out.txt
          moonja -C "$RUNNER_TEMP/build" | grep -q "no work to do"
      - name: Touching CMakeLists.txt re-runs CMake through the generator edge
        run: |
          touch "$RUNNER_TEMP/ninja-src/CMakeLists.txt"
          moonja -C "$RUNNER_TEMP/build" | tee out.txt
          grep -q "Re-running CMake" out.txt
          moonja -C "$RUNNER_TEMP/build" | grep -q "no work to do"
      - name: ninja and moonja share the build directory
        run: |
          python3 -m pip install ninja==1.13.2
          # The real ninja accepts moonja's logs as up to date...
          ninja -C "$RUNNER_TEMP/build" | tee out.txt && grep -q "no work to do" out.txt
          # ...rebuilds what changed, and moonja then accepts ninja's.
          touch "$RUNNER_TEMP/ninja-src/src/util.h"
          ninja -C "$RUNNER_TEMP/build" | tee out.txt
          ! grep -q "no work to do" out.txt
          moonja -C "$RUNNER_TEMP/build" | grep -q "no work to do"

  # moonja vs ninja on a generated 10k-object project (scripts/bench.mjs).
  # The numbers appear in the job summary and as notice annotations.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ninja 1.13.2 (the reference)
        run: python -m pip install ninja==1.13.2
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon build --target js --release
      - name: Benchmark
        run: node scripts/bench.mjs --ninja "$(python -c 'import ninja, os; print(os.path.join(ninja.BIN_DIR, "ninja"))')" --objects 10000 --runs 5

  # More real projects, each configured by its own generator with moonja as
  # the build tool: build, run the project's tests, no-op rebuild, touching a
  # header rebuilds only its users, and the real ninja accepts the result.
  real-projects:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fmt (CMake)
            repo: https://github.com/fmtlib/fmt
            tag: "12.2.1"
            generator: cmake
            header: include/fmt/format.h
          - name: zlib (CMake)
            repo: https://github.com/madler/zlib
            tag: v1.4
            generator: cmake
            header: zlib.h
          - name: inih (Meson)
            repo: https://github.com/benhoyt/inih
            tag: r63
            generator: meson
            header: ini.h
    name: real-projects (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      SRC: ${{ github.workspace }}/../project-src
      OUT: ${{ github.workspace }}/../project-build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon build --target js --release
      - name: Install moonja as `moonja`, ninja 1.13.2 and meson
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec %s %s "$@"\n' "$(command -v node)" "$GITHUB_WORKSPACE/_build/js/release/build/cmd/cmd.js" > "$RUNNER_TEMP/bin/moonja"
          chmod +x "$RUNNER_TEMP/bin/moonja"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          python -m pip install ninja==1.13.2 meson
      - name: Fetch ${{ matrix.name }}
        run: git clone --depth 1 --branch "${{ matrix.tag }}" "${{ matrix.repo }}" "$SRC"
      - name: Configure (CMake)
        if: matrix.generator == 'cmake'
        run: cmake -S "$SRC" -B "$OUT" -G Ninja -DCMAKE_MAKE_PROGRAM="$RUNNER_TEMP/bin/moonja" -DCMAKE_BUILD_TYPE=Release
      - name: Configure (Meson)
        if: matrix.generator == 'meson'
        # meson finds the build tool through $NINJA.
        run: NINJA=moonja meson setup "$OUT" "$SRC" -Dtests=true
      - name: Build
        run: time moonja -C "$OUT"
      - name: The project's tests pass (CMake)
        if: matrix.generator == 'cmake'
        run: ctest --test-dir "$OUT" --output-on-failure --no-tests=error
      - name: The project's tests pass (Meson)
        if: matrix.generator == 'meson'
        run: NINJA=moonja meson test -C "$OUT" --print-errorlogs
      - name: A second build does nothing
        run: moonja -C "$OUT" | tee out.txt && grep -q "no work to do" out.txt
      - name: Touching a header rebuilds its users only
        run: |
          touch "$SRC/${{ matrix.header }}"
          moonja -C "$OUT" | tee out.txt
          ! grep -q "no work to do" out.txt
          moonja -C "$OUT" | grep -q "no work to do"
      - name: ninja and moonja share the build directory
        run: |
          ninja -C "$OUT" | tee out.txt && grep -q "no work to do" out.txt
          touch "$SRC/${{ matrix.header }}"
          ninja -C "$OUT" | tee out.txt
          ! grep -q "no work to do" out.txt
          moonja -C "$OUT" | grep -q "no work to do"
